[package]
name = "kernel_talk_dwarf_rs"
version = "0.1.0"
edition = "2021"
description = "Fast DWARF parser for kernel-talk (Rust backend, exposed via PyO3)"

[lib]
name = "kernel_talk_dwarf_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3  = { version = "0.22", features = ["extension-module"] }
gimli = { version = "0.31", default-features = false, features = ["read", "endian-reader"] }
object = { version = "0.36", features = ["read", "elf"] }
memmap2 = "0.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
