# Reranker v1 training configuration
# Spec §6.3: cross-encoder on (query, candidate_text) → scalar score.
# Base: microsoft/codebert-base (encoder-only, 110M params).

model:
  base: microsoft/codebert-base
  max_length: 512
  # Input format: [CLS] query [SEP] candidate_text [SEP]

training:
  optimizer: AdamW
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.10        # 10% of total steps for linear warmup
  scheduler: cosine_decay
  epochs: 3
  batch_size: 32               # triplet pairs per GPU
  grad_accumulation: 4         # effective batch = 128
  max_grad_norm: 1.0
  seed: 42

  # Loss: margin-based ranking (spec §6.3)
  # L = max(0, margin - score_pos + score_neg)
  margin: 1.0

  # Early stopping: save best by nDCG@5 on val set
  eval_steps: 500
  save_best_metric: ndcg_at_5

data:
  triplets: data/enriched.jsonl
  # Fraction held out for validation (by proposal date if available)
  val_fraction: 0.05
  # Max triplets to load (0 = all)
  max_triplets: 0

output:
  checkpoints: training/checkpoints/reranker/
  log_dir: training/logs/

# Inference config (used by ktalk eval retrieval)
inference:
  # How many bi-encoder candidates to rerank
  rerank_top_n: 100
  # Final top-k to return to caller
  output_top_k: 10
